name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false  # no third-party dependencies

      - name: Formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Tests
        working-directory: backend
        run: go test ./...

      - name: Build
        run: ./build.sh

      # The shell spawns `omock control` and expects a handshake on stdout.
      # A binary that builds but cannot answer it is broken in the way that matters.
      - name: Handshake
        run: |
          set -euo pipefail
          # `head` closes the pipe, so omock takes SIGPIPE on its next write —
          # expected; `|| true` keeps pipefail from failing the step.
          out=$( (echo '{"id":1,"cmd":"hello","version":"0.1.0"}' \
            | timeout 20 ./bin/omock control | head -n1) || true )
          echo "$out"
          echo "$out" | grep -q '"ev":"ready"'

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck build.sh install.sh dev-sync.sh
